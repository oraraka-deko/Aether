name: Compile Aether and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Build Android JNI Shared Libraries
  # ==========================================
  build-android:
    name: Build Android Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Identify Android NDK Directory
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> $GITHUB_ENV

      - name: Install Cargo NDK Helper
        run: cargo install cargo-ndk

      - name: Compile Native Android Libraries
        run: |
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/armeabi-v7a
          mkdir -p jniLibs/x86_64
          mkdir -p jniLibs/x86
          
          # Compile matching Android CPU Architectures
          cargo ndk -t arm64-v8a -o jniLibs build --release --manifest-path=../aether/Cargo.toml
          cargo ndk -t armeabi-v7a -o jniLibs build --release --manifest-path=../aether/Cargo.toml
          cargo ndk -t x86_64 -o jniLibs build --release --manifest-path=../aether/Cargo.toml
          cargo ndk -t x86 -o jniLibs build --release --manifest-path=../aether/Cargo.toml

      - name: Compress JNI Archives
        run: |
          zip -r aether-android-jniLibs.zip jniLibs

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: aether-android-jniLibs.zip

  # ==========================================
  # JOB 2: Build Apple macOS & iOS Libraries
  # ==========================================
  
  # ==========================================
  # JOB 4: Collect Artifacts and Publish Release
  # ==========================================
  publish-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-jniLibs

      - name: Verify Asset Structures
        run: |
          echo "Verifying downloaded archive bundles..."
          ls -la

      - name: Publish Compilation to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aether-android-jniLibs.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}